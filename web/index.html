<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IranNet Monitor — پایش اینترنت ایران</title>
<meta name="description" content="Independent real-time monitor of Iran's internet: connectivity, censorship, ISP reachability and circumvention tools, probed every 5 minutes from outside Iran with raw open data. پایش زنده اینترنت ایران.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Broadsheet design-system tokens (from the IranNet design project) ── */
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #0088b0;
  --color-accent-2: #d6006c;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);
  --color-accent-100: #e9f8ff;
  --color-accent-700: #006786;
  --color-accent-800: #004961;
  --color-accent-2-100: #fff1f4;
  --color-accent-2-700: #aa0b56;
  --color-accent-2-800: #790e3d;
  --color-neutral-100: #f8f4f4;
  --color-neutral-800: #444141;
  --color-process-yellow: #edbb00;
  --font-heading: "Source Serif 4", system-ui, serif;
  --font-body: "Source Serif 4", system-ui, serif;
  --up: #3f9142; --deg: #edbb00; --down: #d6006c; --unk: #bab6b6;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #e7e5e2; color: var(--color-text); font: 400 15px/1.55 var(--font-body); }
h1,h2,h3,h4,h5 { font-family: var(--font-heading); font-weight: 600; line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 10px; }
a { color: var(--color-accent); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-700); }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
[dir="rtl"] body, [dir="rtl"] { font-family: Vazirmatn, var(--font-body); }
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4,[dir="rtl"] h5 { font-family: Vazirmatn, var(--font-heading); }

.tag { display: inline-flex; align-items: center; font-size: 11px; letter-spacing: .02em; padding: 3px 10px; border-radius: 2px; }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.input { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--color-text);
  caret-color: var(--color-accent); background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 2px; }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none;
  font-family: inherit; font-weight: 600; font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent; padding: 10px 18px; border-radius: 2px; }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost { padding-inline: 5px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: start; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent); padding: 10px; border-bottom: 1px solid var(--color-divider); }
.table td { padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }
.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: 2px; background: var(--color-bg); }
.seg-opt { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.seg-opt + .seg-opt { border-inline-start: 1px solid var(--color-divider); }
.seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }

/* CMYK plate headline / numerals — three misregistered process plates whose
   multiply overlap prints the dark core; the .paper span carries the text
   for assistive tech, the plates are aria-hidden repeats. */
.cmyk-head { position: relative; }
.cmyk-head .paper { color: var(--color-bg);
  text-shadow: 0.027em 0.0185em 0 var(--color-bg), -0.0245em -0.0175em 0 var(--color-bg); }
.cmyk-head .plate { position: absolute; inset: 0; mix-blend-mode: multiply; pointer-events: none; user-select: none; }
.cmyk-head .plate-c { color: var(--color-accent); }
.cmyk-head .plate-m { color: var(--color-accent-2); translate: 0.018em 0.0125em; }
.cmyk-head .plate-y { color: var(--color-process-yellow); translate: -0.0155em -0.0115em; }
.cmyk-num { position: relative; width: fit-content; line-height: 0.9; background: var(--color-bg); padding: 0.12em; margin: -0.12em; }
.cmyk-num .paper { color: var(--color-bg);
  text-shadow: 0.036em 0.025em 0 var(--color-bg), -0.031em -0.023em 0 var(--color-bg); }
.cmyk-num .plate { position: absolute; inset: 0.12em; mix-blend-mode: multiply; pointer-events: none; user-select: none; }
.cmyk-num .plate-c { color: var(--color-accent); }
.cmyk-num .plate-m { color: var(--color-accent-2); translate: 0.036em 0.025em; }
.cmyk-num .plate-y { color: var(--color-process-yellow); translate: -0.031em -0.023em; }

@keyframes blip { 0%,100%{opacity:1} 50%{opacity:.25} }
.blip { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-2); animation: blip 1.6s ease-in-out infinite; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .blip { animation: none; } }

.sheet { max-width: 1180px; margin: 28px auto 60px; background: var(--color-bg); border: 1px solid rgba(0,0,0,.1); box-shadow: 0 2px 14px rgba(0,0,0,.09); }
.pad { padding-inline: 34px; }
.muted { color: rgba(32,30,29,.65); }
.kicker { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--color-accent-700); }
.h-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(32,30,29,.65); margin-bottom: 8px; }
.navbtn { background: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14px;
  padding: 6px 2px; border-bottom: 2px solid transparent; color: var(--color-text); }
.navbtn[aria-current="page"] { border-color: var(--color-accent); color: var(--color-accent-800); }
.cellrow { display: grid; grid-template-columns: repeat(48, 1fr); gap: 1.5px; height: 14px; }
.cellrow i, .bars i { display: block; }
.dot { width: 9px; height: 9px; flex: none; display: inline-block; }
.catbtn { display: flex; width: 100%; justify-content: flex-start; gap: 8px; font-size: 12.5px; text-align: start;
  padding: 5px 7px; border-radius: 2px; border: 0; background: none; cursor: pointer; font-family: inherit; color: var(--color-text); }
.catbtn[aria-current="true"] { background: var(--color-accent-100); color: var(--color-accent-800); }
.lang-row { max-width: 1180px; margin: 20px auto 0; display: flex; align-items: center; gap: 14px; font-size: 13px; padding-inline: 4px; }
@media (max-width: 900px) {
  .pad { padding-inline: 18px; }
  .grid2, .grid2w, .grid4, .ep-grid { grid-template-columns: 1fr !important; }
  h1 { font-size: 34px !important; }
  .verdict { font-size: 44px !important; }
  .hrow { grid-template-columns: 110px 1fr 48px !important; }
}
</style>
</head>
<body>
<div class="lang-row">
  <span class="h-label" style="margin:0">Language / زبان</span>
  <div class="seg" role="radiogroup" aria-label="Language">
    <label class="seg-opt"><input type="radio" name="lang" value="en" checked>English</label>
    <label class="seg-opt"><input type="radio" name="lang" value="fa">فارسی</label>
  </div>
</div>

<main class="sheet" id="app" aria-busy="true">
  <div class="pad" style="padding-top:24px;text-align:center;padding-bottom:40px" id="loading">Loading latest pass…</div>
</div>

<script>
(() => {
"use strict";
const UP = "#3f9142", DEG = "#edbb00", DOWN = "#d6006c", UNK = "#bab6b6";
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const state = { lang: "en", page: "overview", group: 0, site: null, now: Date.now() };

const fd = v => String(v).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const num = v => state.lang === "fa" ? fd(v) : String(v);
const color = st => st === "up" ? UP : st === "degraded" ? DEG : st === "down" ? DOWN : UNK;
const cellColor = c => c === "u" ? UP : c === "g" ? DEG : c === "d" ? DOWN : UNK;
const tagClass = st => st === "down" ? "tag tag-accent-2" : st === "up" ? "tag tag-accent" : "tag tag-neutral";

// t(en, fa) — every visible string goes through this.
const t = (en, fa) => state.lang === "fa" ? fa : en;
const dot = st => `<i class="dot" style="background:${color(st)}"></i>`;

const VERDICTS = {
  operational:   ["ALL SYSTEMS UP", "پایدار و برقرار", "none"],
  degraded:      ["DEGRADED", "اختلال جزئی", "minor"],
  partial_outage:["PARTIAL OUTAGE", "قطعی بخشی", "major"],
  major_outage:  ["MAJOR DISRUPTION", "اختلال گسترده", "critical"],
  unknown:       ["NO DATA", "بدون داده", "none"]
};
const PAGES = [
  ["overview", "Overview", "نمای کلی"],
  ["endpoints", "Endpoints", "نقاط پایانی"],
  ["networks", "Networks", "شبکه‌ها"],
  ["history", "History", "تاریخچه"],
  ["analysis", "Analysis", "تحلیل"],
  ["about", "About", "درباره"]
];
// services featured in the overview 24 h grid, most telling first
const HEADLINE_IDS = ["telegram-web","whatsapp-web","instagram","tor-check","psiphon","shaparak","digikala","tic-gw-1"];

const plateText = (txt, cls, style) => `
  <span class="${cls}" style="${style || ""}">
    <span class="paper">${esc(txt)}</span>
    <span class="plate plate-c" aria-hidden="true">${esc(txt)}</span>
    <span class="plate plate-m" aria-hidden="true">${esc(txt)}</span>
    <span class="plate plate-y" aria-hidden="true">${esc(txt)}</span>
  </span>`;

const cellStrip = (cells, h) => `<div class="cellrow" style="height:${h}px">` +
  [...(cells || "?".repeat(48))].map(c => `<i style="background:${cellColor(c)}"></i>`).join("") + "</div>";

const bars = (vals, colorFn, max, h, fmt) => {
  const m = max || Math.max(1, ...vals);
  return vals.map((v, i) =>
    `<div style="display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:${h + 22}px">
       ${fmt ? `<div style="font-size:12px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600">${num(fmt(v))}</div>` : ""}
       <i style="height:${Math.max(2, Math.round(v / m * h))}px;background:${colorFn(v, i)};width:100%;display:block"></i>
     </div>`).join("");
};

const allServices = () => state.site.categories.flatMap(c => c.services);
const tallies = () => {
  const all = allServices();
  const n = st => all.filter(s => s.status === st).length;
  return [
    ["up", "Reachable", "در دسترس", n("up")],
    ["degraded", "Degraded", "کند", n("degraded")],
    ["down", "Unreachable", "قطع", n("down")],
    ["unknown", "No data", "بدون داده", all.filter(s => !["up","degraded","down"].includes(s.status)).length]
  ];
};

const latHistogram = () => {
  const b = [["<100",0,100],["100–250",100,250],["250–500",250,500],["500 ms–1 s",500,1000],["1–3 s",1000,3000],["3 s+",3000,15000],["timeout",15000,1e12]];
  const all = allServices();
  return b.map(([label, lo, hi]) => [label, all.filter(s => (s.status === "down" ? 1e13 : s.latency_ms) >= lo && (s.status === "down" ? 1e13 : s.latency_ms) < hi).length]);
};

const svcName = s => state.lang === "fa" && s.name_fa ? s.name_fa : s.name;

const fmtTime = iso => {
  const d = new Date(iso);
  const s = String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
  return num(s);
};

/* ── page sections ── */

function masthead() {
  const site = state.site;
  const elapsedMin = Math.floor((state.now - Date.parse(site.ts)) / 60000);
  const rel = elapsedMin < 1 ? t("moments ago","چند لحظه پیش")
    : elapsedMin < 60 ? num(elapsedMin) + t(" min ago"," دقیقه پیش")
    : num(Math.floor(elapsedMin / 60)) + t(" h ago"," ساعت پیش");
  const secsToNext = Math.max(0, 300 - Math.floor((state.now - Date.parse(site.ts)) / 1000) % 300);
  const cd = String(Math.floor(secsToNext/60)).padStart(2,"0") + ":" + String(secsToNext%60).padStart(2,"0");
  const dateLong = new Date(state.now).toLocaleDateString(state.lang === "fa" ? "fa-IR" : "en-GB",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return `
  <div class="pad" style="padding-top:24px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap">
      <div>
        <div class="kicker">${t("Independent connectivity observatory","رصدخانه مستقل اتصال‌پذیری")}</div>
        <h1 style="font-size:46px;letter-spacing:-.03em;margin:5px 0 0">${t("IranNet Monitor","پایش اینترنت ایران")}</h1>
      </div>
      <div style="text-align:end;font-size:12px;line-height:1.5;color:rgba(32,30,29,.65);padding-bottom:6px">
        <div>${dateLong}</div>
        <div>${t("Next probe in","پروب بعدی تا")} <b style="font-variant-numeric:tabular-nums;color:var(--color-accent-2-700)">${elapsedMin >= 10 ? "—" : num(cd)}</b></div>
      </div>
    </div>
    <div style="height:4px;background:var(--color-text);margin-top:14px"></div>
    <nav style="display:flex;gap:26px;align-items:center;padding:0 2px;flex-wrap:wrap" aria-label="Pages">
      ${PAGES.map(p => `<button class="navbtn" data-page="${p[0]}" ${state.page === p[0] ? 'aria-current="page"' : ""}>${t(p[1], p[2])}</button>`).join("")}
      <span style="margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(32,30,29,.65)">
        <span class="blip"></span>${t("last check","آخرین بررسی")} ${rel}
      </span>
    </nav>
    <div style="height:1px;background:var(--color-text)"></div>
  </div>`;
}

function overview() {
  const site = state.site;
  const [ven, vfa] = VERDICTS[site.overall] || VERDICTS.unknown;
  const all = allServices();
  const nDown = all.filter(s => s.status === "down").length;
  const an = site.analysis;
  const lede = (state.lang === "fa" && an?.public_summary_fa)
    ? esc(an.public_summary_fa)
    : an?.public_summary
      ? esc(an.public_summary)
      : t(`${nDown} of ${all.length} monitored endpoints failed to answer on the ${fmtTime(site.ts)} UTC pass.`,
          `در بررسی ساعت ${fmtTime(site.ts)} به وقت جهانی، ${num(nDown)} نقطه از ${num(all.length)} نقطه پایش‌شده پاسخ ندادند.`);
  const downSvcs = all.filter(s => s.status === "down").slice(0, 4);
  const lat = latHistogram();
  const headline = HEADLINE_IDS.map(id => all.find(s => s.id === id)).filter(Boolean);
  return `
  <div class="pad grid2" style="padding-top:30px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:start">
    <div>
      <h2 class="verdict" style="font-size:62px;margin:0">${plateText(t(ven, vfa), "cmyk-head", "line-height:.95;letter-spacing:-.035em;display:inline-block")}</h2>
      <p style="font-size:17px;line-height:1.55;margin:18px 0 0;max-width:48ch;text-wrap:pretty">${lede}</p>
    </div>
    <div class="grid4" style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px 16px">
      ${tallies().map(tl => `
        <div>
          ${plateText(num(tl[3]), "cmyk-num", "font-size:50px;font-weight:600")}
          <div style="margin-top:20px;display:flex;align-items:center;gap:7px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">
            ${dot(tl[0])}${t(tl[1], tl[2])}
          </div>
        </div>`).join("")}
    </div>
  </div>

  <div class="pad grid2w" style="padding-top:34px;display:grid;grid-template-columns:1.25fr 1fr;gap:44px;align-items:start">
    <div>
      <h4 style="margin:0 0 4px">${t("Last 24 hours","۲۴ ساعت گذشته")}</h4>
      <div style="font-size:11.5px;color:rgba(32,30,29,.65);margin-bottom:14px">${t("48 half-hour buckets per row","۴۸ بازه نیم‌ساعته در هر ردیف")}</div>
      <div class="hrow" style="display:grid;grid-template-columns:175px 1fr 56px;gap:5px 14px;align-items:center">
        ${headline.map(s => `
          <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(svcName(s))}</div>
          ${cellStrip(s.cells, 14)}
          <div style="font-size:11.5px;text-align:end;font-variant-numeric:tabular-nums;color:rgba(32,30,29,.65)">${num(s.uptime24.toFixed(1))}%</div>`).join("")}
      </div>
      <div style="display:flex;gap:16px;font-size:11px;color:rgba(32,30,29,.65);margin-top:14px">
        <span style="display:flex;align-items:center;gap:5px">${dot("up")}${t("up","در دسترس")}</span>
        <span style="display:flex;align-items:center;gap:5px">${dot("degraded")}${t("degraded","کند")}</span>
        <span style="display:flex;align-items:center;gap:5px">${dot("down")}${t("down","قطع")}</span>
      </div>
    </div>
    <div>
      <h4 style="margin:0 0 4px">${t("Response-time histogram","هیستوگرام زمان پاسخ")}</h4>
      <div style="font-size:11.5px;color:rgba(32,30,29,.65);margin-bottom:18px">${t("Endpoints per latency bucket, this pass","تعداد نقاط در هر بازه تأخیر، این دور")}</div>
      <div class="bars" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end">
        ${bars(lat.map(b => b[1]), (v,i) => i >= 5 ? DOWN : i >= 3 ? DEG : UP, null, 120, v => v)}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;border-top:1px solid var(--color-text);padding-top:6px">
        ${lat.map(b => `<div style="font-size:10px;text-align:center;line-height:1.25;color:rgba(32,30,29,.65)">${b[0]}</div>`).join("")}
      </div>
    </div>
  </div>

  <div class="pad" style="padding-top:34px;padding-bottom:36px">
    <h4 style="margin:0 0 12px">${t("Currently unreachable","اکنون قطع")}</h4>
    ${downSvcs.length === 0 ? `<p class="muted" style="font-size:14px">${t("Nothing is down on this pass.","در این دور هیچ نقطه‌ای قطع نیست.")}</p>` : `
    <div class="grid4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px">
      ${downSvcs.map(s => `
        <div style="border-top:3px solid var(--color-text);padding-top:9px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span class="tag tag-accent-2">${t("DOWN","قطع")}</span>
            <span style="font-size:11px;color:rgba(32,30,29,.65);font-variant-numeric:tabular-nums">${fmtTime(state.site.ts)}</span>
          </div>
          <div style="font-size:14.5px;margin-top:6px;line-height:1.35">${esc(svcName(s))}</div>
          <div style="font-size:11px;color:rgba(32,30,29,.65)">${esc(s.kind)}</div>
        </div>`).join("")}
    </div>`}
  </div>`;
}

function endpoints() {
  const cats = state.site.categories;
  const g = cats[Math.min(state.group, cats.length - 1)];
  const q = (state.filter || "").toLowerCase();
  const rows = g.services.filter(s => !q || s.name.toLowerCase().includes(q) || (s.name_fa || "").includes(q));
  return `
  <div class="ep-grid" style="display:grid;grid-template-columns:200px 1fr;align-items:start">
    <aside style="padding:22px 18px;border-inline-end:1px solid var(--color-divider)">
      <input class="input" id="filter" placeholder="${t("Filter endpoints…","جست‌وجوی نقطه پایانی…")}" value="${esc(state.filter || "")}" style="margin-bottom:16px">
      <div class="h-label">${t("Status","وضعیت")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">
        ${tallies().map(tl => `<span class="btn btn-secondary" style="font-size:11.5px;padding:4px 9px;gap:5px;cursor:default">${dot(tl[0])}${t(tl[1],tl[2])} ${num(tl[3])}</span>`).join("")}
      </div>
      <div class="h-label">${t("Category","دسته")}</div>
      <div style="display:flex;flex-direction:column;gap:2px">

/* ── render loop ── */

function render() {
  if (!state.site) return;
  document.documentElement.dir = state.lang === "fa" ? "rtl" : "ltr";
  document.documentElement.lang = state.lang;
  const app = $("#app");
  const pages = { overview, endpoints, networks, history, analysis, about };
  app.setAttribute("aria-busy", "false");
  app.innerHTML = masthead() + pages[state.page]();
  app.querySelectorAll("[data-page]").forEach(b =>
    b.addEventListener("click", () => { state.page = b.dataset.page; location.hash = b.dataset.page; render(); }));
  app.querySelectorAll("[data-group]").forEach(b =>
    b.addEventListener("click", () => { state.group = +b.dataset.group; render(); }));
  const filter = $("#filter");
  if (filter) filter.addEventListener("input", () => {
    state.filter = filter.value;
    render(); // cheap full re-render; restore focus to the recreated input
    const f = $("#filter"); f.focus(); f.setSelectionRange(f.value.length, f.value.length);
  });
}

document.querySelectorAll('input[name="lang"]').forEach(r =>
  r.addEventListener("change", () => { state.lang = r.value; render(); }));

// keep the countdown/masthead clock honest without re-rendering everything each second
setInterval(() => { state.now = Date.now(); if (state.site) render(); }, 30000);

if (location.hash && PAGES.some(p => p[0] === location.hash.slice(1))) state.page = location.hash.slice(1);

/* ── WebMCP (Chrome 149+ origin trial): expose the monitor to AI agents ── */
function registerWebMCP() {
  const mc = document.modelContext || navigator.modelContext;
  if (!mc?.registerTool) return;
  const j = v => JSON.stringify(v);
  const tools = [
    {
      name: "get_status",
      description: "Current overall status of Iran's internet as measured by this monitor: verdict, up/degraded/down counts, median latency and pass timestamp (UTC).",
      inputSchema: { type: "object", properties: {} },
      annotations: { readOnlyHint: true },
      execute: async () => j({
        ts: state.site.ts, overall: state.site.overall,
        counts: state.site.counts, median_latency_ms: state.site.median_ms
      })
    },
    {
      name: "get_endpoints",
      description: "Monitored endpoints with status, latency and 24h uptime. Optionally filter by category name or status (up/degraded/down).",
      inputSchema: {
        type: "object",
        properties: {
          category: { type: "string", description: "exact or partial category name, e.g. 'Circumvention'" },
          status: { type: "string", enum: ["up", "degraded", "down"] }
        }
      },
      annotations: { readOnlyHint: true },
      execute: async ({ category, status }) => j(
        state.site.categories
          .filter(c => !category || c.name.toLowerCase().includes(category.toLowerCase()))
          .flatMap(c => c.services
            .filter(sv => !status || sv.status === status)
            .map(sv => ({ category: c.name, name: sv.name, kind: sv.kind, status: sv.status, latency_ms: sv.latency_ms, uptime_24h_pct: +(sv.uptime24 || 0).toFixed(1) })))
      )
    },
    {
      name: "get_networks",
      description: "Per-operator reachability of labeled Iranian IP ranges (one representative IP per registered allocation, TCP :80): ranges, addresses covered, reachable share, median latency.",
      inputSchema: { type: "object", properties: {} },
      annotations: { readOnlyHint: true },
      execute: async () => j(state.site.networks || { error: "no IP-range data in the latest pass" })
    },
    {
      name: "get_analysis",
      description: "Latest LLM (Hermes via Ollama) analysis of the monitoring data: severity, suspected causes, affected services, public summary, insight and recommendation.",
      inputSchema: { type: "object", properties: {} },
      annotations: { readOnlyHint: true },
      execute: async () => j(state.site.analysis || { error: "no analysis generated yet" })
    },
    {
      name: "show_page",
      description: "Navigate the status page UI to a section and optionally switch language.",
      inputSchema: {
        type: "object",
        properties: {
          page: { type: "string", enum: PAGES.map(p => p[0]) },
          lang: { type: "string", enum: ["en", "fa"] }
        },
        required: ["page"]
      },
      execute: async ({ page, lang }) => {
        state.page = page; if (lang) state.lang = lang;
        location.hash = page; render();
        return `Showing ${page}` + (lang ? ` in ${lang}` : "");
      }
    }
  ];
  for (const t of tools) Promise.resolve(mc.registerTool(t)).catch(() => {});
}

fetch("data/site.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(site => { state.site = site; render(); registerWebMCP(); })
  .catch(err => { $("#loading").textContent = "Could not load data/site.json — " + err.message; });
})();
</script>
</body>
</html>
